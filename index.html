<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファイル送信テスト (Webhook.site)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f9fafb;
      color: #333;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    .file-info {
      background-color: #f3f4f6;
      padding: 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .file-info.active {
      display: block;
    }
    .error-text {
      color: #dc2626;
      font-weight: bold;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }
    #result {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      display: none;
    }
    .result-success { background-color: #d1fae5; color: #065f46; display: block !important; }
    .result-error { background-color: #fee2e2; color: #991b1b; display: block !important; }
  </style>
</head>
<body>

  <div class="container">
    <h2>📤 Webhook.site 送信テスト</h2>
    
    <div class="form-group">
      <label for="webhookUrl">1. Webhook.siteのURL (Your unique URL)</label>
      <input type="text" id="webhookUrl" placeholder="https://webhook.site/xxxx-xxxx-xxxx" required>
    </div>

    <div class="form-group">
      <label for="fileInput">2. テストするファイルを選択</label>
      <input type="file" id="fileInput" required>
    </div>

    <div id="fileInfo" class="file-info">
      <strong>【選択されたファイル情報】</strong>
      <ul style="margin: 8px 0 0; padding-left: 20px;">
        <li>名前: <span id="fileName"></span></li>
        <li>サイズ: <span id="fileSize"></span></li>
        <li>種類: <span id="fileType"></span></li>
      </ul>
    </div>

    <button id="sendBtn" disabled>送信する</button>

    <div id="result"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const webhookUrlInput = document.getElementById('webhookUrl');
    const sendBtn = document.getElementById('sendBtn');
    const fileInfo = document.getElementById('fileInfo');
    const fileNameSpan = document.getElementById('fileName');
    const fileSizeSpan = document.getElementById('fileSize');
    const fileTypeSpan = document.getElementById('fileType');
    const resultDiv = document.getElementById('result');

    // ファイル選択時の処理（情報の表示とボタンの活性化）
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      resultDiv.style.display = 'none';
      resultDiv.className = '';
      
      if (file) {
        fileNameSpan.textContent = file.name;
        fileTypeSpan.textContent = file.type || '不明';
        
        // サイズが0バイトの場合は赤字で警告
        if (file.size === 0) {
          fileSizeSpan.innerHTML = '<span class="error-text">0 バイト (読込失敗の可能性あり)</span>';
        } else {
          fileSizeSpan.textContent = `${file.size} バイト`;
        }
        
        fileInfo.classList.add('active');
        checkForm();
      } else {
        fileInfo.classList.remove('active');
        sendBtn.disabled = true;
      }
    });

    // URL入力時の処理
    webhookUrlInput.addEventListener('input', checkForm);

    function checkForm() {
      const url = webhookUrlInput.value.trim();
      const file = fileInput.files[0];
      // URLが入力されており、かつファイルが選択されている場合のみボタンを有効化
      sendBtn.disabled = !(url.startsWith('https://webhook.site/') && file);
    }

    // 送信ボタンクリック時の処理
    sendBtn.addEventListener('click', async () => {
      const url = webhookUrlInput.value.trim();
      const file = fileInput.files[0];

      if (!file) return;

      // 送信データの準備 (multipart/form-data)
      const formData = new FormData();
      formData.append('testFile', file);
      formData.append('message', 'ブラウザからの直接送信テストです');

      sendBtn.disabled = true;
      sendBtn.textContent = '送信中...';
      resultDiv.className = '';
      resultDiv.textContent = '';

      try {
        const response = await fetch(url, {
          method: 'POST',
          body: formData,
          // fetchにFormDataを渡す場合、Content-Typeヘッダーはブラウザが自動設定(boundary付き)するため指定しません
        });

        if (response.ok) {
          resultDiv.textContent = '✅ 送信成功！Webhook.siteの画面を確認してください。';
          resultDiv.className = 'result-success';
        } else {
          resultDiv.textContent = `❌ 送信エラー: ${response.status} ${response.statusText}`;
          resultDiv.className = 'result-error';
        }
      } catch (error) {
        resultDiv.textContent = `❌ ネットワークエラー: ${error.message}`;
        resultDiv.className = 'result-error';
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = '送信する';
      }
    });
  </script>
</body>
</html>
